name: 'Tapelock'
description: 'Run Tapelock checks against recorded LLM cassettes in CI.'
author: 'Tapelock'

inputs:
  cassette:
    description: 'Path to a cassette file, or a directory of .jsonl cassette files, to check.'
    required: true
  version:
    description: >-
      tapelock CLI version to install, as a Go module version (e.g. v0.1.0).
      Defaults to the latest commit on the default branch, pin this for
      reproducible CI once tapelock starts tagging releases.
    required: false
    default: 'latest'
  args:
    description: >-
      Extra arguments passed through to every `tapelock check` call, e.g.
      "--status 200 --max-total-tokens 2000".
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 'stable'

    - name: Install tapelock
      shell: bash
      run: go install github.com/tapelock/tapelock/cmd/tapelock@${{ inputs.version }}

    - name: Run tapelock check
      shell: bash
      run: ${{ github.action_path }}/scripts/check.sh "${{ inputs.cassette }}" ${{ inputs.args }}
